<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Booking Listing (Sandbox)</title>
    <style>
      :root { --ink:#0f172a; --muted:#64748b; --border:#e2e8f0; --brand:#003580; --cta:#0071c2; }
      * { box-sizing: border-box; }
      body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background: #f8fafc; color: var(--ink); }
      .top { background: var(--brand); padding: 18px; color: white; }
      .bar { margin-top: 12px; display:flex; gap: 10px; align-items:center; }
      input { flex: 1; padding: 10px 12px; border-radius: 10px; border: 0; outline: none; }
      button.search-btn { background: var(--cta); border: 0; color: white; padding: 10px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; }
      .wrap { max-width: 980px; margin: 0 auto; padding: 18px; }
      .property-card { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 16px; display:flex; gap: 14px; }
      .thumb { width: 170px; height: 120px; border-radius: 14px; background: linear-gradient(135deg, rgba(6,182,212,0.20), rgba(59,130,246,0.15)); border: 1px solid rgba(15,23,42,0.08); }
      h2 { margin: 0; font-size: 16px; color: #1d4ed8; }
      .row { margin-top: 8px; font-size: 12px; color: #334155; }
      .pill { display:inline-flex; align-items:center; gap:6px; padding: 6px 10px; border-radius: 999px; background: #ecfeff; border: 1px solid rgba(6,182,212,0.25); font-size: 11px; color:#0e7490; font-weight: 700; }
      .meta { margin-top: 10px; display:flex; align-items:flex-end; justify-content:space-between; gap: 12px; }
      .review-count { font-size: 12px; color: var(--muted); }
      .price { font-weight: 900; font-size: 18px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .data { display:none; }
    </style>
  </head>
  <body>
    <div class="top">
      <div style="font-weight:800">Booking.com</div>
      <div class="bar">
        <input id="booking-search" placeholder="Where are you going?" />
        <button class="search-btn">Search</button>
      </div>
    </div>

    <div class="wrap">
      <div class="property-card">
        <div class="thumb"></div>
        <div style="flex:1;min-width:0">
          <h2 data-field="propertyName">Sea Glass Inn</h2>
          <div class="row" data-field="location">Chichijima, Ogasawara · 200m from beach</div>
          <div class="row">
            <span class="pill">Free cancellation</span>
            <span class="pill">Breakfast included</span>
          </div>
          <div class="meta">
            <div>
              <div class="review-count"><span data-field="reviewCount">142</span> reviews</div>
              <div class="mono">Rating: <span data-field="rating">8.7</span></div>
              <div class="row" style="color:#dc2626">Last booked <span data-field="lastBooked">2 hours ago</span></div>
            </div>
            <div class="mono" style="text-align:right">
              <div style="font-size:11px;color:var(--muted)">per night</div>
              <div class="price" data-field="pricePerNight">¥16,800</div>
            </div>
          </div>
          <div class="data">
            <span data-field="freeCancel">true</span>
            <span data-field="breakfastIncluded">true</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
