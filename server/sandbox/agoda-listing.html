<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Agoda Listing (Sandbox)</title>
    <style>
      :root { --ink:#0f172a; --muted:#64748b; --border:#e2e8f0; --brand:#5C2D91; }
      * { box-sizing: border-box; }
      body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background: #ffffff; color: var(--ink); }
      header { background: var(--brand); color: white; padding: 18px; display:flex; align-items:center; justify-content:space-between; }
      .wrap { max-width: 980px; margin: 0 auto; padding: 18px; }
      .card { border: 1px solid var(--border); border-radius: 18px; padding: 16px; background: #faf5ff; }
      .price-display { background: white; border: 1px solid var(--border); border-radius: 14px; padding: 12px; display:flex; align-items:flex-start; justify-content:space-between; gap: 10px; }
      .strike { color: var(--muted); text-decoration: line-through; font-size: 12px; }
      .price { font-weight: 900; font-size: 18px; color: #dc2626; }
      .tag { display:inline-flex; align-items:center; padding: 6px 10px; border-radius: 999px; background: rgba(92,45,145,0.12); color: var(--brand); font-size: 11px; font-weight: 800; border: 1px solid rgba(92,45,145,0.25); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .data { display:none; }
    </style>
  </head>
  <body>
    <header>
      <div style="font-weight:900">agoda</div>
      <div style="font-size:12px;opacity:0.8">Sandbox</div>
    </header>

    <div class="wrap">
      <h1 style="margin:0 0 6px;font-size:18px" data-field="propertyName">Sea Glass Inn</h1>
      <div style="color:var(--muted);font-size:12px;margin-bottom:14px">Chichijima, Ogasawara, Tokyo</div>

      <div class="agoda-pricing card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <div style="font-weight:900">Room Options</div>
          <span class="tag">Member Deal</span>
        </div>

        <div class="price-display">
          <div>
            <div style="font-weight:800;font-size:13px">Ocean View Room</div>
            <div style="font-size:12px;color:var(--muted);margin-top:4px">Breakfast included</div>
          </div>
          <div style="text-align:right" class="mono">
            <div class="strike">¥18,100</div>
            <div class="price" data-field="agodaPrice">¥15,900</div>
            <div style="font-size:12px;color:#16a34a;font-weight:800" data-field="discountPercent">12%</div>
          </div>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:12px;color:var(--muted)">
          <div style="color:#dc2626;font-weight:800">
            Only <span data-field="roomsLeft">3</span> rooms left!
          </div>
          <div>Price excludes tax</div>
        </div>

        <div class="data">
          <span data-field="agodaRating">8.9</span>
          <span data-field="memberDeal">true</span>
          <span data-field="includesTax">false</span>
        </div>
      </div>
    </div>
  </body>
</html>
