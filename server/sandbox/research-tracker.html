<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Research Tracker (Sandbox)</title>
    <style>
      :root { --ink:#0f172a; --muted:#64748b; --border:#e2e8f0; }
      * { box-sizing: border-box; }
      body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background:#f8fafc; color: var(--ink); }
      header { background: white; border-bottom: 1px solid var(--border); padding: 14px 18px; }
      .wrap { max-width: 980px; margin: 0 auto; padding: 18px; }
      .sheet { background: white; border: 1px solid var(--border); border-radius: 14px; overflow:hidden; }
      .row { display:grid; grid-template-columns: 220px 90px 100px 100px 70px 140px; }
      .head { background:#f1f5f9; font-size: 11px; font-weight: 900; color:#475569; text-transform: uppercase; letter-spacing: 0.08em; }
      .cell { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; border-right: 1px solid #f1f5f9; font-size: 12px; }
      .row .cell:last-child { border-right: 0; }
      .notes { margin-top: 12px; background: white; border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
      label { display:block; font-size: 11px; font-weight: 900; color:#64748b; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
      textarea { width: 100%; min-height: 64px; resize: vertical; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); font-size: 12px; outline: none; }
      select { padding: 8px 10px; border-radius: 999px; border: 1px solid var(--border); font-size: 11px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    </style>
  </head>
  <body>
    <header>
      <div style="font-weight:900">Chichijima Accommodation Research</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">Sandbox tracker</div>
    </header>

    <div class="wrap">
      <div class="sheet">
        <div class="row head">
          <div class="cell">Property</div>
          <div class="cell">Site</div>
          <div class="cell">Booking</div>
          <div class="cell">Agoda</div>
          <div class="cell">Rating</div>
          <div class="cell">Status</div>
        </div>
        <div class="row">
          <div class="cell">Sea Glass Inn</div>
          <div class="cell">Wix</div>
          <div class="cell mono">¥16,800</div>
          <div class="cell mono">¥15,900</div>
          <div class="cell mono">8.7</div>
          <div class="cell">
            <select id="tracker-status">
              <option>—</option>
              <option>Contacted</option>
              <option>Pitched</option>
              <option>Ready to Pitch</option>
              <option>Skipped</option>
            </select>
          </div>
        </div>
      </div>

      <div class="notes">
        <label for="tracker-notes">Notes — Sea Glass Inn</label>
        <textarea id="tracker-notes" placeholder="Add notes..."></textarea>
      </div>
    </div>
  </body>
</html>
